name: Update TLE snapshots

# Daily server-side pull of Celestrak orbital element groups, committed to data/.
# Runs in GitHub Actions (no browser CORS limits), so the page can load the full
# constellations same-origin instead of paginating the live API 120 times.
on:
  schedule:
    - cron: '17 6 * * *'   # ~06:17 UTC daily
  workflow_dispatch:        # allow manual "Run workflow" for the first seed

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Celestrak groups
        run: |
          set -e
          mkdir -p data
          UA="orbit-tle-sync/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          base="https://celestrak.org/NORAD/elements/gp.php"

          # group_on_celestrak -> local filename (the page fetches data/<name>.txt)
          fetch() {
            local group="$1" out="$2"
            echo "Fetching $group ..."
            curl -fsS --retry 4 --retry-delay 6 -A "$UA" \
              "$base?GROUP=$group&FORMAT=tle" -o "data/$out.tmp" || { echo "  fetch failed for $group"; return 0; }
            # Only accept a result that looks like real TLE data (has a line-1 record).
            if [ -s "data/$out.tmp" ] && grep -q "^1 " "data/$out.tmp"; then
              # normalise CRLF -> LF and move into place
              tr -d '\r' < "data/$out.tmp" > "data/$out.txt"
              echo "  $(grep -c '^1 ' "data/$out.txt") objects -> data/$out.txt"
            else
              echo "  looked empty/invalid, keeping previous data/$out.txt"
            fi
            rm -f "data/$out.tmp"
          }

          fetch starlink starlink
          fetch gps-ops  gps
          fetch galileo  galileo
          fetch geo      geo
          fetch stations stations

      - name: Fetch star catalog (once / refresh)
        run: |
          # Real bright-star catalog (mag < 6) for the inertial sky. The page also
          # falls back to the jsDelivr copy and then a procedural field, so this is best-effort.
          if [ ! -s data/stars.json ]; then
            curl -fsS --retry 3 --retry-delay 5 \
              "https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.6.json" \
              -o data/stars.json.tmp && mv data/stars.json.tmp data/stars.json || { echo "star catalog fetch failed (non-fatal)"; rm -f data/stars.json.tmp; }
          fi

      - name: Commit if changed
        run: |
          git config user.name  "tle-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.txt data/stars.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No TLE changes."
          else
            git commit -m "Update TLE snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
