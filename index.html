<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Earth → Orbit</title>
<style>
  :root { --fg:#e9f1fb; --muted:#9fb3cc; --accent:#4ea3ff; --amber:#f2b65a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#05070d; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--fg); }
  #scene { position:fixed; inset:0; display:block; }

  .panel { position:fixed; background:rgba(10,16,28,0.55); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); border:1px solid rgba(120,160,210,0.18);
    border-radius:14px; padding:14px 16px; }

  #title { top:16px; left:16px; max-width:300px; }
  #title h1 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:0.3px; }
  #title p { margin:0; font-size:12px; color:var(--muted); line-height:1.5; }
  #status { margin-top:8px; font-size:11px; color:var(--accent); }
  #status .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); margin-right:6px; vertical-align:middle; box-shadow:0 0 6px var(--accent); }
  #status.warn { color:var(--amber); } #status.warn .dot { background:var(--amber); box-shadow:0 0 6px var(--amber); }

  #hud { bottom:16px; left:16px; min-width:220px; }
  #hud .row { display:flex; justify-content:space-between; gap:18px; font-size:12px; margin:3px 0; }
  #hud .row span:first-child { color:var(--muted); }
  #hud .alt { font-size:22px; font-weight:600; margin:2px 0 8px; letter-spacing:0.4px; }
  #hud .region { color:var(--accent); font-weight:500; }
  #speed { display:flex; gap:6px; margin-top:10px; }
  #speed button { flex:1; background:rgba(20,30,48,0.6); color:var(--muted); border:1px solid rgba(120,160,210,0.22);
    border-radius:8px; padding:5px 0; font-size:11px; cursor:pointer; }
  #speed button.active { color:var(--fg); border-color:var(--accent); background:rgba(40,70,120,0.6); }

  #nav { top:16px; right:16px; display:flex; flex-direction:column; gap:7px; }
  #nav button { background:rgba(20,30,48,0.6); color:var(--fg); border:1px solid rgba(120,160,210,0.22);
    border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; text-align:left;
    transition:background .15s, border-color .15s; min-width:128px; }
  #nav button:hover { background:rgba(40,70,120,0.7); border-color:var(--accent); }
  #nav button small { color:var(--muted); float:right; margin-left:10px; }

  #info { bottom:16px; right:16px; max-width:264px; opacity:0; transform:translateY(6px);
    transition:opacity .2s, transform .2s; pointer-events:none; }
  #info.show { opacity:1; transform:none; }
  #info h3 { margin:0 0 4px; font-size:14px; }
  #info p { margin:0; font-size:12px; color:var(--muted); line-height:1.5; }
  #info .tag { display:inline-block; font-size:11px; color:var(--amber); margin-bottom:6px; }

  #loader { position:fixed; inset:0; background:#05070d; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px; z-index:50; transition:opacity .6s; }
  #loader.hide { opacity:0; pointer-events:none; }
  .spin { width:34px; height:34px; border:3px solid rgba(120,160,210,0.25);
    border-top-color:var(--accent); border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loader p { font-size:13px; color:var(--muted); }

  @media (max-width:640px){
    #title { max-width:200px; padding:10px 12px; }
    #title h1 { font-size:15px; }
    #nav button { min-width:104px; padding:7px 10px; font-size:12px; }
    #hud { min-width:180px; }
  }
</style>
</head>
<body>
  <div id="loader"><div class="spin"></div><p id="loadMsg">Loading planetary textures…</p></div>
  <canvas id="scene"></canvas>

  <div id="title" class="panel">
    <h1>Earth → Orbit</h1>
    <p>Drag to rotate · scroll / pinch to zoom · tap a satellite for detail. Orbits are live, propagated from real tracking data.</p>
    <div id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </div>

  <div id="nav" class="panel" style="background:none;border:none;backdrop-filter:none;padding:0;">
    <button data-dist="1.28">Surface <small>0 mi</small></button>
    <button data-dist="1.55">ISS <small>250 mi</small></button>
    <button data-dist="1.85">Starlink <small>340 mi</small></button>
    <button data-dist="9">GPS <small>12,550 mi</small></button>
    <button data-dist="14">GEO <small>22,236 mi</small></button>
    <button data-dist="95">Moon <small>238,900 mi</small></button>
  </div>

  <div id="hud" class="panel">
    <div class="alt" id="altVal">0 mi</div>
    <div class="row"><span>Region</span><span class="region" id="regionVal">Surface</span></div>
    <div class="row"><span>Tracking</span><span id="countVal">—</span></div>
    <div class="row"><span>Sim time (UTC)</span><span id="timeVal">—</span></div>
    <div id="speed">
      <button data-mult="1" class="active">Live</button>
      <button data-mult="60">60×</button>
      <button data-mult="600">600×</button>
    </div>
  </div>

  <div id="info" class="panel">
    <span class="tag" id="infoTag"></span>
    <h3 id="infoName"></h3>
    <p id="infoText"></p>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "satellite.js": "https://esm.sh/satellite.js@5.0.0"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as satellite from 'satellite.js';

const EARTH_MI = 3959;          // Earth radius in miles (for the altitude HUD)
const EARTH_KM = 6371;          // Earth radius in km  (scene unit = 1 Earth radius)
const alt = mi => 1 + mi / EARTH_MI;
const TEX = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';
const API = 'https://tle.ivanstanojevic.me/api/tle';

// ECI (km) -> scene vector, with Earth's spin axis mapped to +Y
const eciToScene = (p, v) => { v.set(p.x / EARTH_KM, p.z / EARTH_KM, -p.y / EARTH_KM); return v; };

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.002, 4000);
camera.position.set(0, 0.5, 2.6);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5; controls.minDistance = 1.04; controls.maxDistance = 150;
controls.enablePan = false;
controls.enableZoom = false;   // custom smooth zoom handled below

const sunDir = new THREE.Vector3(5, 1.6, 3).normalize();
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.copy(sunDir);
scene.add(sun); scene.add(new THREE.AmbientLight(0x223044, 0.5));

// ---------- Textures ----------
const manager = new THREE.LoadingManager();
const loader = new THREE.TextureLoader(manager);
const load = f => { const t = loader.load(TEX + f); t.colorSpace = THREE.SRGBColorSpace; return t; };
const dayTex = load('earth_atmos_2048.jpg');
const nightTex = load('earth_lights_2048.png');
const specTex = load('earth_specular_2048.jpg');
const normTex = loader.load(TEX + 'earth_normal_2048.jpg');
const cloudTex = load('earth_clouds_1024.png');
const moonTex = load('moon_1024.jpg');

// ---------- Earth (spins with sidereal time) ----------
const earthGroup = new THREE.Group(); scene.add(earthGroup);
const earthMat = new THREE.MeshPhongMaterial({
  map: dayTex, specularMap: specTex, normalMap: normTex,
  normalScale: new THREE.Vector2(0.7, 0.7), specular: new THREE.Color(0x2a3a55), shininess: 14
});
const uSun = { value: sunDir.clone() };
earthMat.onBeforeCompile = (shader) => {
  shader.uniforms.uNightMap = { value: nightTex };
  shader.uniforms.uSunDir = uSun;
  shader.vertexShader = 'varying vec3 vWN;\n' + shader.vertexShader.replace(
    '#include <begin_vertex>', '#include <begin_vertex>\n  vWN = mat3(modelMatrix) * normal;');
  shader.fragmentShader = 'uniform sampler2D uNightMap;\nuniform vec3 uSunDir;\nvarying vec3 vWN;\n' +
    shader.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       float dsun = dot(normalize(vWN), normalize(uSunDir));
       float night = smoothstep(0.10, -0.18, dsun);
       vec3 city = texture2D(uNightMap, vMapUv).rgb;
       totalEmissiveRadiance += city * night * 1.7;`);
};
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), earthMat));
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.004, 64, 64),
  new THREE.MeshPhongMaterial({ map: cloudTex, transparent:true, opacity:0.75, depthWrite:false }));
earthGroup.add(clouds);

const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.025, 64, 64),
  new THREE.ShaderMaterial({
    uniforms: { uColor:{ value:new THREE.Color(0x4ea3ff) } },
    vertexShader:`varying vec3 vN; varying vec3 vP;
      void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vP=mv.xyz; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 vN; varying vec3 vP; uniform vec3 uColor;
      void main(){ vec3 vd=normalize(-vP); float f=pow(1.0-abs(dot(vN,vd)),3.0); gl_FragColor=vec4(uColor*f,f); }`,
    blending:THREE.AdditiveBlending, side:THREE.BackSide, transparent:true, depthWrite:false }));
scene.add(atmosphere);

// ---------- Stars ----------
function starTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const grd=g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(0.3,'rgba(255,255,255,0.8)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}
(function stars(){
  const N=7000,R=900,pos=new Float32Array(N*3),col=new Float32Array(N*3),siz=new Float32Array(N);
  const tint=[[1,1,1],[0.75,0.83,1],[1,0.95,0.85],[1,0.82,0.7]];
  for(let i=0;i<N;i++){
    let u=Math.random()*2-1,th=Math.random()*Math.PI*2; if(Math.random()<0.22)u*=0.16;
    const s=Math.sqrt(1-u*u); let x=s*Math.cos(th),y=u,z=s*Math.sin(th);
    const ty=y*0.92-z*0.39,tz=y*0.39+z*0.92;
    pos[i*3]=x*R;pos[i*3+1]=ty*R;pos[i*3+2]=tz*R;
    const c=tint[(Math.random()*tint.length)|0],b=0.55+Math.random()*0.45;
    col[i*3]=c[0]*b;col[i*3+1]=c[1]*b;col[i*3+2]=c[2]*b; siz[i]=1.2+Math.random()*Math.random()*5;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('size',new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({ uniforms:{uTex:{value:starTexture()}},
    vertexShader:`attribute float size; varying vec3 vC;
      void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*(300.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform sampler2D uTex; varying vec3 vC;
      void main(){ gl_FragColor=vec4(vC,1.0)*texture2D(uTex,gl_PointCoord); }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending });
  scene.add(new THREE.Points(g,m));
})();

const pickables = [];

// ---------- Moon (representative position) ----------
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.273,48,48), new THREE.MeshPhongMaterial({ map:moonTex }));
const moonR = alt(238900); moon.position.set(moonR*0.82, moonR*0.18, -moonR*0.54);
scene.add(moon); pickables.push(moon);
moon.userData={ tag:'Cislunar space', name:'The Moon — 238,900 mi',
  text:'Earth\u2019s natural satellite, ~60 Earth-radii away — about 960× farther than the ISS.' };

// ---------- GEO (representative, geostationary so ~static) ----------
function ring(radius, inclDeg, color, op){
  const seg=256, pts=[];
  for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius)); }
  const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent:true, opacity:op }));
  l.rotation.x=THREE.MathUtils.degToRad(inclDeg); scene.add(l); return l;
}
ring(alt(62),0,0xf2b65a,0.22);
ring(alt(22236),0,0xf2b65a,0.4);
const geoBeacon=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,16), new THREE.MeshBasicMaterial({color:0xffd27a}));
geoBeacon.position.set(alt(22236),0,0); scene.add(geoBeacon); pickables.push(geoBeacon);
geoBeacon.userData={ tag:'Geostationary', name:'GEO — 22,236 mi',
  text:'At 22,236 mi the orbital period equals one day, so the satellite hovers over a fixed point. Used for TV, weather and broadcast comms.' };

// ---------- Live satellites ----------
const groups = {};   // name -> { satrecs:[], points, beacon }
function makeCloud(count, color, size){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count*3),3));
  const pts=new THREE.Points(geo, new THREE.PointsMaterial({ color, size, sizeAttenuation:true, transparent:true, opacity:0.95, depthWrite:false }));
  scene.add(pts); return pts;
}
function makeBeacon(color, data){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.013,16,16), new THREE.MeshBasicMaterial({color}));
  scene.add(m); pickables.push(m); m.userData=data; return m;
}

async function fetchById(id){
  const r=await fetch(`${API}/${id}`); if(!r.ok) throw new Error('iss'); const j=await r.json();
  return [satellite.twoline2satrec(j.line1, j.line2)];
}
async function fetchSearch(query, pages){
  const out=[];
  for(let p=1;p<=pages;p++){
    const r=await fetch(`${API}/?search=${encodeURIComponent(query)}&page=${p}&page-size=100`);
    if(!r.ok) break; const j=await r.json(); const mem=j.member||[];
    for(const m of mem) out.push(satellite.twoline2satrec(m.line1, m.line2));
    if(mem.length<100) break;
  }
  return out;
}

// ISS orbit trail (one full revolution from current elements)
function issTrail(satrec){
  const pts=[], t0=Date.now(), tmp=new THREE.Vector3();
  for(let i=0;i<=120;i++){
    const d=new Date(t0 + i*46000); // ~92 min across 120 steps
    const pv=satellite.propagate(satrec,d); if(!pv.position) continue;
    pts.push(eciToScene(pv.position, tmp).clone());
  }
  const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x66e0ff, transparent:true, opacity:0.45 }));
  scene.add(l);
}

let liveReady=false;
async function loadSatellites(){
  document.getElementById('loadMsg').textContent='Fetching live orbital data…';
  try {
    const [iss, gps, starlink] = await Promise.all([
      fetchById(25544),
      fetchSearch('navstar', 1),
      fetchSearch('starlink', 6)
    ]);

    groups.iss = { satrecs:iss, beacon: makeBeacon(0x9bf0ff, { tag:'Low Earth Orbit', name:'ISS — ~250 mi',
      text:'The International Space Station, tracked live. It orbits ~250 mi up at 17,500 mph, circling Earth every ~92 minutes.' }) };
    if(iss[0]) issTrail(iss[0]);

    groups.gps = { satrecs:gps, points: makeCloud(gps.length, 0xc6f0a8, 0.03),
      beacon: makeBeacon(0xc6f0a8, { tag:'Medium Earth Orbit', name:'GPS — ~12,550 mi',
      text:`Live GPS constellation (${gps.length} satellites tracked). Each orbits twice a day; signal delay and relativistic time dilation must be corrected for your position fix.` }) };

    groups.starlink = { satrecs:starlink, points: makeCloud(starlink.length, 0xbfe3ff, 0.02),
      beacon: makeBeacon(0xffffff, { tag:'Low Earth Orbit', name:'Starlink — ~340 mi',
      text:`Live sample of ${starlink.length} of ~12,000 Starlink satellites at ~340 mi. Low altitude means low latency (~25 ms) but each covers a small area — hence the huge constellation.` }) };

    const total = iss.length + gps.length + starlink.length;
    document.getElementById('countVal').textContent = total.toLocaleString() + ' sats (live)';
    document.getElementById('statusText').textContent = 'Live orbital data';
    liveReady = true;
  } catch(e){
    document.getElementById('status').classList.add('warn');
    document.getElementById('statusText').textContent = 'Live data unavailable — showing representative orbits';
    document.getElementById('countVal').textContent = 'representative';
    fallbackShells();
  }
}
function fallbackShells(){
  ring(alt(250),51.6,0x66e0ff,0.5);
  const sl=makeCloud(900,0xbfe3ff,0.018), pos=sl.geometry.attributes.position.array;
  for(let i=0;i<900;i++){ const lon=Math.random()*Math.PI*2,lat=(Math.random()*2-1)*0.92,r=alt(340);
    pos[i*3]=r*Math.cos(lat)*Math.cos(lon); pos[i*3+1]=r*Math.sin(lat); pos[i*3+2]=r*Math.cos(lat)*Math.sin(lon); }
  sl.geometry.attributes.position.needsUpdate=true;
}

// ---------- Picking ----------
const ray=new THREE.Raycaster(); ray.params.Points.threshold=0.03;
const ndc=new THREE.Vector2(); const infoEl=document.getElementById('info');
canvas.addEventListener('click', e=>{
  ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if(hit && hit.object.userData.name){
    const d=hit.object.userData;
    document.getElementById('infoTag').textContent=d.tag;
    document.getElementById('infoName').textContent=d.name;
    document.getElementById('infoText').textContent=d.text;
    infoEl.classList.add('show');
  } else infoEl.classList.remove('show');
});

// ---------- Zoom + fly-to (smooth, unified) ----------
const MIND=1.06, MAXD=150;
let targetDist = THREE.MathUtils.clamp(camera.position.length(), MIND, MAXD);
const setTarget = d => { targetDist = THREE.MathUtils.clamp(d, MIND, MAXD); };

document.querySelectorAll('#nav button').forEach(b=>
  b.addEventListener('click', ()=> setTarget(parseFloat(b.dataset.dist))));

// Mouse / trackpad wheel — multiplicative so it feels even at every scale
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  setTarget(targetDist * Math.exp(e.deltaY * 0.0009));
}, { passive:false });

// Pinch-to-zoom (touch)
let pinchPrev=0;
const pinchDist = e => { const a=e.touches[0], b=e.touches[1];
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); };
canvas.addEventListener('touchstart', e=>{ if(e.touches.length===2) pinchPrev=pinchDist(e); }, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2){ e.preventDefault();
    const d=pinchDist(e); if(pinchPrev) setTarget(targetDist*(pinchPrev/d)); pinchPrev=d; }
}, {passive:false});
canvas.addEventListener('touchend', ()=>{ pinchPrev=0; });

// Eased approach toward the target distance each frame
function applyZoom(dt){
  const d=camera.position.length();
  const k=1-Math.exp(-dt*6);
  camera.position.setLength(d + (targetDist-d)*k);
}

// ---------- Time control ----------
let speed=1, simEpoch=Date.now(), wallEpoch=performance.now();
function simNow(){ return simEpoch + (performance.now()-wallEpoch)*speed; }
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#speed button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  simEpoch = simNow(); wallEpoch = performance.now();  // rebase so time stays continuous
  speed = parseFloat(b.dataset.mult);
}));

// ---------- Update satellites ----------
const _p=new THREE.Vector3();
function updateGroup(g, date){
  if(!g) return;
  const arr = g.points ? g.points.geometry.attributes.position.array : null;
  for(let i=0;i<g.satrecs.length;i++){
    const pv=satellite.propagate(g.satrecs[i], date);
    if(!pv || !pv.position){ if(arr){arr[i*3]=arr[i*3+1]=arr[i*3+2]=0;} continue; }
    eciToScene(pv.position,_p);
    if(arr){ arr[i*3]=_p.x; arr[i*3+1]=_p.y; arr[i*3+2]=_p.z; }
    if(i===0 && g.beacon) g.beacon.position.copy(_p);
  }
  if(arr) g.points.geometry.attributes.position.needsUpdate=true;
}

// ---------- HUD ----------
const altVal=document.getElementById('altVal'), regionVal=document.getElementById('regionVal');
const timeVal=document.getElementById('timeVal');
function region(mi){
  if(mi<7.5)return'Troposphere'; if(mi<31)return'Stratosphere'; if(mi<53)return'Mesosphere';
  if(mi<62)return'Mesosphere · Kármán line'; if(mi<375)return'Thermosphere · LEO';
  if(mi<6200)return'Exosphere · LEO'; if(mi<22236)return'Space · MEO';
  if(mi<60000)return'Space · GEO'; return'Cislunar space';
}
const fmt=n=>Math.round(n).toLocaleString();

// ---------- Loop ----------
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const date=new Date(simNow());
  const gmst=satellite.gstime(date);
  earthGroup.rotation.y=gmst; clouds.rotation.y=now*0.000004;
  if(liveReady){ updateGroup(groups.iss,date); updateGroup(groups.gps,date); updateGroup(groups.starlink,date); }
  applyZoom(dt); controls.update();
  const mi=(camera.position.length()-1)*EARTH_MI;
  altVal.textContent=fmt(Math.max(0,mi))+' mi'; regionVal.textContent=region(Math.max(0,mi));
  timeVal.textContent=date.toISOString().substr(11,8);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

manager.onLoad=()=>{ document.getElementById('loader').classList.add('hide'); };
loadSatellites();
requestAnimationFrame(tick);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
